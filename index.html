<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#080809">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="description" content="Oxmo — creative house for film, photography, visual storytelling, and cinematic design.">
  <title>Oxmo One App — Creative House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080809;
      --panel: rgba(255,255,255,.055);
      --panel-strong: rgba(255,255,255,.085);
      --line: rgba(255,255,255,.105);
      --text: #f4f4f5;
      --muted: #95959d;
      --subtle: #686871;
      --red: #e12b4b;
      --red-2: #8d1129;
      --green: #81d9ae;
      --radius: 24px;
      --shadow: 0 26px 80px rgba(0,0,0,.38);
      --max: 1220px;
      --bleed-pad: max(24px, calc((100vw - var(--max)) / 2));
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background:
        radial-gradient(ellipse at 12% 5%, rgba(147,18,45,.18), transparent 32%),
        radial-gradient(ellipse at 88% 35%, rgba(87,21,38,.12), transparent 34%),
        linear-gradient(180deg, #09090b 0%, #080809 48%, #0b0b0e 100%);
      font-family: 'DM Sans', sans-serif; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    .app-shell { width: min(100% - 48px, var(--max)); margin: 0 auto; padding-bottom: 122px; }
    .topbar { height: 86px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand-mark { width:40px; height:40px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.16); border-radius:13px; background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.025)); box-shadow: inset 0 1px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.3); }
    .brand-mark img { width:26px; height:26px; object-fit:contain; display:block; }
.footer-logo { width:20px; height:20px; object-fit:contain; vertical-align:middle; margin-right:8px; }
    .brand-name { font:600 17px 'Space Grotesk',sans-serif; letter-spacing:-.05em; }
    .brand-sub { font-size:9px; letter-spacing:.23em; color:#777780; text-transform:uppercase; margin-top:2px; }
    .top-status { display:flex; align-items:center; gap:8px; font-size:11px; color:#c9c9ce; border:1px solid var(--line); border-radius:999px; padding:9px 13px; background:rgba(255,255,255,.035); backdrop-filter:blur(18px); }
    .status-dot { width:6px; height:6px; border-radius:99px; background:var(--green); box-shadow:0 0 12px rgba(129,217,174,.8); }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .icon-button { width:40px; height:40px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; background:var(--panel); cursor:pointer; transition:.2s; }
    .icon-button:hover { background:var(--panel-strong); border-color:rgba(255,255,255,.24); transform:translateY(-1px); }
    .icon-button svg { width:17px; height:17px; stroke:currentColor; }
    main { min-height:calc(100vh - 230px); }
    .page { animation:pageIn .34s ease both; }
    @keyframes pageIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .eyebrow { color:#b8b8c0; font-size:10px; font-weight:700; letter-spacing:.23em; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
    .eyebrow::before { content:''; width:23px; height:1px; background:var(--red); box-shadow:0 0 10px rgba(225,43,75,.8); }
    h1,h2,h3,h4,p { margin-top:0; }
    h1,h2,h3 { font-family:'Space Grotesk',sans-serif; letter-spacing:-.055em; }
    h1 { font-size:clamp(42px,6.6vw,82px); line-height:.99; font-weight:500; margin:20px 0 20px; max-width:760px; }
    h2 { font-size:clamp(29px,4vw,45px); line-height:1.04; font-weight:500; margin:12px 0; }
    h3 { font-size:20px; font-weight:500; margin-bottom:8px; }
    .gradient-text { background:linear-gradient(105deg,#fff 0%,#e7dadd 40%,#e13a58 90%); color:transparent; background-clip:text; -webkit-background-clip:text; }
    .muted { color:var(--muted); }
    .small { font-size:12px; line-height:1.7; }
    .lead { color:#aaaab2; font-size:clamp(14px,1.55vw,17px); line-height:1.8; max-width:590px; }
    .btn { min-height:46px; border:1px solid var(--line); border-radius:999px; padding:0 19px; display:inline-flex; justify-content:center; align-items:center; gap:10px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.01em; transition:transform .2s,border-color .2s,background .2s; }
    .btn:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.3); }
    .btn-primary { border-color:rgba(255,82,110,.45); background:linear-gradient(115deg,#e22e4d,#9a1530); box-shadow:0 10px 34px rgba(177,20,49,.22),inset 0 1px rgba(255,255,255,.23); color:#fff; }
    .btn-primary:hover { box-shadow:0 14px 38px rgba(177,20,49,.32); }
    .btn-quiet { background:rgba(255,255,255,.045); backdrop-filter:blur(12px); }
    .btn svg { width:15px; height:15px; }
    .hero { position:relative; display:grid; grid-template-columns:1.12fr .88fr; gap:30px; align-items:center; padding:52px 0 46px; min-height:510px; }
    .hero-copy { position:relative; z-index:2; }
    .hero-copy h1 span { display:block; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:30px; }
    .hero-meta { display:flex; align-items:center; gap:18px; margin-top:38px; color:#888891; font-size:11px; }
    .hero-meta strong { display:block; color:#f4f4f5; font:500 19px 'Space Grotesk',sans-serif; letter-spacing:-.04em; margin-bottom:2px; }
    .hero-meta .meta-divider { height:27px; width:1px; background:var(--line); }
    .hero-art { min-height:430px; position:relative; display:grid; place-items:center; perspective:1000px; }
    .hero.hero-minimal { grid-template-columns:1fr; gap:0; min-height:0; padding:24px 0 38px; }
    .hero-minimal .hero-copy { display:flex; justify-content:center; order:2; margin-top:-2px; }
    .hero-minimal .hero-actions { margin:0; justify-content:center; }
    .hero-minimal .hero-art { width:min(100%,760px); min-height:clamp(330px,48vw,540px); margin:0 auto; }
    .hero-minimal .art-orbit { width:min(72%,440px); }
    .hero-minimal .poster-title, .hero-minimal .poster-caption, .hero-minimal .floating-tag { display:none; }
    .top-status { display:none!important; }
    .halo { position:absolute; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle,rgba(199,25,58,.2),rgba(125,15,36,.06) 45%,transparent 70%); filter:blur(4px); }
    .art-orbit { width:min(100%,420px); aspect-ratio:1/1.05; position:relative; transform:rotateY(-10deg) rotateX(4deg); }
    .poster-art { position:absolute; width:53%; aspect-ratio:2/2.8; border-radius:17px; border:1px solid rgba(255,255,255,.22); overflow:hidden; box-shadow:0 28px 60px rgba(0,0,0,.48); background:#1c1c21; }
    .poster-art::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 15%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.88)); z-index:1; }
    .poster-art::after { content:''; position:absolute; inset:10px; border:1px solid rgba(255,255,255,.17); border-radius:10px; z-index:2; }
    .poster-art .poster-glow { position:absolute; inset:0; background:radial-gradient(ellipse at 52% 24%,rgba(236,69,91,.62),transparent 42%),linear-gradient(145deg,#32121d,#17171e 52%,#08090c); }
    .poster-art .poster-title { position:absolute; z-index:3; left:20px; right:18px; bottom:25px; font:600 clamp(14px,2vw,22px) 'Space Grotesk',sans-serif; line-height:1.02; text-transform:uppercase; letter-spacing:-.05em; }
    .poster-art .poster-caption { position:absolute; z-index:3; left:20px; bottom:12px; font-size:7px; color:#c9bec0; letter-spacing:.2em; text-transform:uppercase; }
    .poster-back { transform:translate(-75px,20px) rotate(-13deg) scale(.86); opacity:.72; }
    .poster-back .poster-glow { background:radial-gradient(ellipse at 52% 34%,rgba(189,158,109,.52),transparent 40%),linear-gradient(145deg,#30251e,#101116 70%); }
    .poster-front { transform:translate(45px,-10px) rotate(7deg); z-index:2; }
    .poster-front .poster-glow { background:radial-gradient(ellipse at 50% 25%,rgba(239,80,99,.58),transparent 40%),linear-gradient(145deg,#3c1222,#17171c 65%,#08090c); }
    .poster-mid { transform:translate(-10px,58px) rotate(-3deg) scale(.92); z-index:1; }
    .poster-mid .poster-glow { background:radial-gradient(ellipse at 50% 30%,rgba(103,129,152,.45),transparent 40%),linear-gradient(145deg,#1d2c35,#111218 66%,#050609); }
    .floating-tag { position:absolute; z-index:4; padding:11px 14px; display:flex; align-items:center; gap:9px; border:1px solid rgba(255,255,255,.15); border-radius:14px; background:rgba(20,20,24,.62); backdrop-filter:blur(18px); box-shadow:0 14px 35px rgba(0,0,0,.35); font-size:10px; color:#e5e5e8; }
    .floating-tag.one { top:54px; right:-5px; }
    .floating-tag.two { left:0; bottom:60px; }
    .tag-symbol { width:24px; height:24px; border-radius:8px; display:grid; place-items:center; background:linear-gradient(140deg,#e02c4b,#631126); }
    .section { padding:42px 0; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .section-head p { max-width:430px; margin:0; }
    .text-link { color:#eaa1ad; display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; white-space:nowrap; }
    .text-link svg { width:14px; height:14px; }
    .glass { border:1px solid var(--line); background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.022)); backdrop-filter:blur(20px); box-shadow:inset 0 1px rgba(255,255,255,.07),0 16px 45px rgba(0,0,0,.15); }
    .work-rail { display:flex; gap:15px; overflow-x:auto; padding:4px 2px 18px; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .work-rail::-webkit-scrollbar { display:none; }
    .work-card { flex:0 0 222px; scroll-snap-align:start; cursor:pointer; text-align:left; padding:0; border:0; background:none; color:inherit; }
    .work-poster { position:relative; aspect-ratio:2/2.72; overflow:hidden; border:1px solid rgba(255,255,255,.14); border-radius:18px; background:#17171c; isolation:isolate; transition:transform .35s,border-color .25s; }
    .work-card:hover .work-poster { transform:translateY(-5px); border-color:rgba(255,255,255,.35); }
    .work-poster::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.86) 100%); z-index:1; }
    .work-poster img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .55s; }
    .work-card:hover img { transform:scale(1.04); }
    .poster-placeholder { position:absolute; inset:0; overflow:hidden; background:var(--poster-bg,linear-gradient(145deg,#2a1720,#121216 64%,#070709)); }
    .poster-placeholder::before { content:''; position:absolute; width:80%; aspect-ratio:1; left:10%; top:14%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.23),rgba(225,43,75,.16) 36%,transparent 70%); filter:blur(4px); }
    .poster-placeholder::after { content:''; position:absolute; inset:12px; border:1px solid rgba(255,255,255,.14); border-radius:12px; }
    .poster-abstract { position:absolute; left:15%; right:15%; top:22%; height:40%; border-radius:50% 50% 8px 8px; background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.015)); filter:blur(.2px); transform:rotate(-10deg); }
    .poster-content { position:absolute; z-index:2; left:18px; right:16px; bottom:18px; }
    .poster-kicker { font-size:8px; letter-spacing:.24em; color:rgba(255,255,255,.7); text-transform:uppercase; margin-bottom:10px; }
    .poster-name { font:600 23px/.99 'Space Grotesk',sans-serif; letter-spacing:-.06em; text-transform:uppercase; }
    .poster-meta { display:flex; gap:7px; align-items:center; font-size:9px; color:#c1c1c8; margin-top:9px; }
    .work-card-info { padding:12px 3px 0; display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
    .work-card-info strong { font-size:13px; font-weight:600; display:block; }
    .work-card-info span { font-size:10px; color:var(--muted); display:block; margin-top:4px; }
    .round-arrow { border:1px solid var(--line); width:35px; height:35px; flex:0 0 35px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.04); cursor:pointer; }
    .round-arrow svg { width:14px; height:14px; }
    .rail-controls { display:flex; gap:8px; }
    .cta-band { position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.12); border-radius:26px; padding:32px; background:radial-gradient(ellipse at 90% 0%,rgba(200,29,58,.25),transparent 44%),linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); }
    .cta-band::after { content:'OXMO'; position:absolute; right:20px; bottom:-30px; color:rgba(255,255,255,.025); font:700 110px 'Space Grotesk',sans-serif; letter-spacing:-.1em; pointer-events:none; }
    .page-intro { padding:38px 0 30px; display:flex; justify-content:space-between; align-items:end; gap:28px; }
    .page-intro h1 { font-size:clamp(40px,6vw,68px); margin:14px 0; }
    .page-intro p { max-width:560px; margin-bottom:0; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 23px; }
    .filter-chip { border:1px solid var(--line); background:rgba(255,255,255,.035); color:#bcbcc4; border-radius:999px; padding:10px 15px; font-size:11px; cursor:pointer; transition:.2s; }
    .filter-chip.active { color:white; border-color:rgba(225,43,75,.6); background:linear-gradient(110deg,rgba(225,43,75,.28),rgba(225,43,75,.08)); box-shadow:0 5px 18px rgba(180,25,53,.12); }
    .work-full-rail .work-card { flex-basis:250px; }
    .work-full-rail { width:100vw; margin-left:calc(50% - 50vw); padding-left:var(--bleed-pad); padding-right:var(--bleed-pad); scroll-padding-left:var(--bleed-pad); }
    .service-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .service-card { padding:24px; border-radius:22px; min-height:230px; position:relative; overflow:hidden; }
    .service-card::after { content:''; position:absolute; width:180px; height:180px; border-radius:50%; right:-70px; top:-85px; background:radial-gradient(circle,rgba(225,43,75,.17),transparent 70%); pointer-events:none; }
    .service-icon { width:40px; height:40px; border:1px solid var(--line); border-radius:13px; display:grid; place-items:center; background:rgba(255,255,255,.05); margin-bottom:22px; }
    .service-icon svg { width:19px; height:19px; stroke:#ef7c8f; }
    .service-card p { color:var(--muted); font-size:12px; line-height:1.7; max-width:500px; }
    .service-list { display:flex; flex-wrap:wrap; gap:7px; margin:18px 0; }
    .service-pill { font-size:10px; padding:7px 10px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:#c6c6cd; border-radius:99px; }
    .service-card-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:15px; margin-top:18px; }
    .service-card-foot span { color:#b7b7bf; font-size:10px; }
    .pricing-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .price-card { padding:21px; border-radius:19px; min-height:220px; display:flex; flex-direction:column; }
    .price-card.featured { border-color:rgba(225,43,75,.48); background:radial-gradient(ellipse at 100% 0%,rgba(225,43,75,.17),transparent 50%),rgba(255,255,255,.05); }
    .price-card .price-category { color:#e5a1ac; font-size:9px; letter-spacing:.15em; text-transform:uppercase; }
    .price-card h3 { font-size:17px; margin:12px 0 7px; }
    .price-card p { color:var(--muted); line-height:1.65; font-size:11px; }
    .price-value { font:500 22px 'Space Grotesk',sans-serif; margin-top:auto; padding-top:15px; }
    .price-value small { font:400 10px 'DM Sans',sans-serif; color:var(--muted); }
    .team-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
    .team-card { overflow:hidden; border-radius:21px; position:relative; }
    .team-photo { aspect-ratio:4/4.8; background:radial-gradient(ellipse at 50% 30%,rgba(225,43,75,.25),transparent 52%),linear-gradient(145deg,#25252c,#101014); overflow:hidden; position:relative; }
    .team-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .team-initial { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.82); font:500 clamp(38px,6vw,72px) 'Space Grotesk',sans-serif; letter-spacing:-.08em; }
    .team-copy { padding:17px 18px 19px; }
    .team-copy .team-role { color:#e58a9b; font-size:9px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px; }
    .team-copy h3 { margin-bottom:7px; }
    .team-copy p { color:var(--muted); font-size:11px; line-height:1.7; margin-bottom:0; }
    .team-social { display:inline-flex; margin-top:13px; color:#f0a0ad; font-size:10px; }
    .booking-layout { display:grid; grid-template-columns:.72fr 1.28fr; gap:18px; align-items:start; }
    .booking-aside { padding:26px; border-radius:23px; position:sticky; top:20px; background:radial-gradient(ellipse at 0 0,rgba(225,43,75,.17),transparent 55%),linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); }
    .booking-aside h2 { font-size:30px; }
    .step-list { margin-top:28px; display:grid; gap:18px; }
    .step { display:flex; gap:12px; align-items:flex-start; }
    .step-num { width:25px; height:25px; display:grid; place-items:center; flex:0 0 25px; border:1px solid rgba(225,43,75,.4); color:#f08a9b; border-radius:50%; font-size:10px; }
    .step strong { display:block; font-size:12px; margin-bottom:4px; }
    .step span { display:block; color:var(--muted); font-size:10px; line-height:1.5; }
    .form-panel { border-radius:23px; padding:27px; }
    .form-panel h2 { font-size:27px; margin-bottom:7px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; margin-top:23px; }
    .field { display:flex; flex-direction:column; gap:8px; min-width:0; }
    .field.full { grid-column:1/-1; }
    .field label { color:#c5c5cc; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .field input,.field select,.field textarea { width:100%; min-height:46px; border:1px solid rgba(255,255,255,.11); border-radius:12px; outline:0; padding:12px 13px; background:rgba(0,0,0,.26); color:#f2f2f4; font-size:12px; transition:border-color .2s,box-shadow .2s; }
    .field textarea { min-height:110px; resize:vertical; line-height:1.6; }
    .field input:focus,.field select:focus,.field textarea:focus { border-color:rgba(225,43,75,.65); box-shadow:0 0 0 3px rgba(225,43,75,.1); }
    .field input::placeholder,.field textarea::placeholder { color:#666671; }
    .field select option { background:#17171b; }
    .check-line { display:flex; gap:10px; color:#a8a8b0; font-size:10px; line-height:1.55; align-items:flex-start; }
    .check-line input { accent-color:var(--red); margin-top:1px; }
    .form-note { font-size:10px; line-height:1.6; color:#888892; }
    .form-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:22px; }
    .hidden-trap { position:absolute!important; left:-9999px!important; opacity:0!important; pointer-events:none!important; }
    .client-layout { display:grid; grid-template-columns:.8fr 1.2fr; gap:16px; align-items:stretch; }
    .client-intro { min-height:350px; padding:28px; border-radius:23px; background:radial-gradient(ellipse at 10% 0%,rgba(225,43,75,.2),transparent 52%),linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); position:relative; overflow:hidden; }

    function apiCall(action, params={}) {
      if (!API_READY) return Promise.reject(new Error('API_URL belum dihubungkan ke Google Apps Script.'));
      return new Promise((resolve,reject) => {
        const callback = '__oxmo_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
        const script = document.createElement('script');
        let finished = false;
        const clean = () => { if (finished) return; finished = true; clearTimeout(timer); delete window[callback]; script.remove(); };
        window[callback] = response => { clean(); if (response && response.ok) resolve(response); else reject(new Error(response && response.error ? response.error : 'API tidak mengembalikan data valid.')); };
        const query = new URLSearchParams({action, callback, _ts:String(Date.now()), ...params});
        script.src = API_URL + (API_URL.includes('?') ? '&' : '?') + query.toString();
        script.onerror = () => { clean(); reject(new Error('Apps Script tidak dapat diakses. Periksa deployment /exec dan izin Anyone.')); };
        const timer = setTimeout(() => { clean(); reject(new Error('Request ke Apps Script timeout. Periksa koneksi dan deployment.')); }, 20000);
        document.body.appendChild(script);
      });
    }

    // POST bridge: hidden form + iframe avoids putting booking details or
    // client credentials into URL query strings on a static GitHub Pages site.
    function apiPost(action, payload={}) {
      if (!API_READY) return Promise.reject(new Error('API_URL belum dihubungkan ke Google Apps Script.'));
      return new Promise((resolve,reject) => {
        const requestId = 'oxmo_' + Date.now() + '_' + Math.floor(Math.random()*1000000);
        const target = 'oxmo_frame_' + requestId;
        const iframe = document.createElement('iframe');
        iframe.name = target; iframe.setAttribute('aria-hidden','true');
        iframe.style.cssText = 'position:absolute;width:1px;height:1px;left:-10000px;bottom:0;border:0;opacity:0;';
        const form = document.createElement('form');
        form.method = 'POST'; form.action = API_URL; form.target = target;
        form.style.display = 'none';
        const fields = {action, request_id:requestId, payload:JSON.stringify(payload)};
        Object.entries(fields).forEach(([name,value]) => {
          const input = document.createElement('input'); input.type='hidden'; input.name=name; input.value=String(value); form.appendChild(input);
        });
        let finished = false;
        const clean = () => {
          if (finished) return; finished = true; clearTimeout(timer);
          window.removeEventListener('message',onMessage); form.remove(); iframe.remove();
        };
        const onMessage = event => {
          if (event.source !== iframe.contentWindow || !event.data || event.data.channel !== 'OXMO_ONE_APP' || event.data.request_id !== requestId) return;
          const response = event.data.data; clean();
          if (response && response.ok) resolve(response);
          else reject(new Error(response && response.error ? response.error : 'Request failed.'));
        };
        window.addEventListener('message',onMessage);
        const timer = setTimeout(() => { clean(); reject(new Error('Koneksi terlalu lama. Periksa deployment Apps Script dan coba kembali.')); },20000);
        document.body.appendChild(iframe); document.body.appendChild(form);
        form.submit();
      });
    }

    function emptyPublicData() {
      return { settings:{}, services:[], packages:[], portfolio:[], team:[], testimonials:[], faq:[] };
    }

    async function loadPublicData() {
      if (!API_READY) { state.apiStatus='preview'; return false; }
      state.apiStatus='loading'; state.apiError='';
      try {
        const data = await apiCall('publicData');
        ['services','packages','portfolio','team','testimonials','faq'].forEach(key => {
          if (!Array.isArray(data[key])) throw new Error('Respons API tidak memiliki daftar ' + key + '. Deploy ulang Code.gs versi Sync Fix.');
        });
        if (!data.settings || typeof data.settings !== 'object') throw new Error('Data Settings tidak terbaca dari Google Sheets.');
        state.data = {
          settings: data.settings,
          services: data.services,
          packages: data.packages,
          portfolio: data.portfolio,
          team: data.team,
          testimonials: data.testimonials,
          faq: data.faq
        };
        state.apiStatus='live';
        state.apiUpdatedAt=data.updated_at || new Date().toISOString();
        state.apiVersion=data.api_version || 'legacy';
                try { localStorage.setItem('oxmo_cache_v1', JSON.stringify({t:Date.now(), d:state.data})); } catch (_) {}
        state.apiError='';
        return true;
      } catch (error) {
        console.error('Oxmo database sync failed:', error);
        // Do not show stale DEMO_DATA when API_URL is set but the database failed.
                let cached = null;
        try { cached = JSON.parse(localStorage.getItem('oxmo_cache_v1') || 'null'); } catch (_) {}
        if (cached && cached.d && Array.isArray(cached.d.portfolio)) {
          state.data = cached.d; state.apiStatus='live'; state.apiVersion='cache'; state.apiError='';
          return true;
        }
        state.data = emptyPublicData();
        state.apiStatus='error';
        state.apiError=error.message || 'Unknown API error';
        return false;
      }
    }

        /* ---- Buang simbol teks yang berubah jadi stiker di iPhone ---- */
    const SYM_TEST = /[↗◉▶▣✳◌◎✉\uFE0F]/;
    const SYM_ALL = /[↗◉▶▣✳◌◎✉\uFE0F]/g;
    function fixSymbolNode(node) {
      if (SYM_TEST.test(node.nodeValue)) node.nodeValue = node.nodeValue.replace(SYM_ALL, '').trim();
    }
    function stripSymbols(root) {
      const walker = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT);
      let node; while ((node = walker.nextNode())) fixSymbolNode(node);
    }
    new MutationObserver(muts => muts.forEach(m => {
      if (m.type === 'characterData') fixSymbolNode(m.target);
      else m.addedNodes.forEach(n => { if (n.nodeType === 3) fixSymbolNode(n); else if (n.nodeType === 1) stripSymbols(n); });
    })).observe(document.body, {childList:true, subtree:true, characterData:true});

    /* ---- Parallax hero ---- */
    function parallaxTick() { return;
      const bg = document.querySelector('.hero-bg'); if (!bg) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const r = bg.parentElement.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      bg.style.transform = 'translate3d(0,' + (-r.top * 0.18).toFixed(1) + 'px,0) scale(1.06)';
    }
    let pxBusy = false;
    window.addEventListener('scroll', () => {
      if (pxBusy) return; pxBusy = true;
      requestAnimationFrame(() => { pxBusy = false; parallaxTick(); });
    }, {passive:true});

    /* ---- Staggered fade up ---- */
    function staggerReveal() {
      if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const groups = $$('#appMain .section, #appMain .page-intro').filter(g => !g.parentElement.closest('.section'));
      const itemSel = ':scope > *, .service-grid > *, .stat-grid > *, .quote-grid > *, .faq-list > *, .contact-grid > *, .pricing-grid > *, .team-grid > *, .step-list > *';
      const io = new IntersectionObserver(entries => entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const items = entry.target.__rv || [];
        items.forEach(el => el.classList.add('in'));
        setTimeout(() => items.forEach(el => { el.classList.remove('rv', 'in'); el.style.transitionDelay = ''; }), 1800);
        io.unobserve(entry.target);
      }), {threshold:.08, rootMargin:'0px 0px -4% 0px'});
      groups.forEach(g => {
        let items = Array.from(g.querySelectorAll(itemSel));
        items = items.filter(el => !items.some(o => o !== el && el.contains(o)));
        items.forEach((el, i) => { el.classList.add('rv'); el.style.transitionDelay = (Math.min(i, 10) * 70) + 'ms'; });
        g.__rv = items;
        io.observe(g);
      });
    }

    /* ---- Rel film tanpa batas, poster tengah terfokus ---- */
    function setupCarousel() {
      const rail = $('#homeFilmRail'); if (!rail) return;
      const cards = $$('.work-card', rail);
      const n = Number(rail.dataset.count) || 1;
      const copies = Math.max(1, Math.round(cards.length / n));
      let centers = [];
      const measure = () => { centers = cards.map(c => c.offsetLeft + c.offsetWidth / 2); };
      const mark = () => {
        const mid = rail.scrollLeft + rail.clientWidth / 2;
        let best = 0, dist = 1e9;
        centers.forEach((x, i) => { const d = Math.abs(x - mid); if (d < dist) { dist = d; best = i; } });
        cards.forEach((c, i) => c.classList.toggle('is-center', i === best));
        return best;
      };
      const centerOn = (i, smooth) => rail.scrollTo({left: centers[i] - rail.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto'});
      const recenter = () => {
        const b = mark(), copy = Math.floor(b / n);
        if (copy >= 1 && copy <= copies - 2) return;
        const target = (b % n) + n * Math.floor(copies / 2);
        rail.style.scrollSnapType = 'none';
        rail.scrollLeft = centers[target] - rail.clientWidth / 2;
        requestAnimationFrame(() => { rail.style.scrollSnapType = ''; mark(); });
      };
      let raf = 0, timer = 0;
      rail.addEventListener('scroll', () => {
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; mark(); });
        clearTimeout(timer); timer = setTimeout(recenter, 160);
      }, {passive:true});
      // klik poster samping = jadikan tengah dulu; klik poster tengah = buka detail
      rail.addEventListener('click', e => {
        const c = e.target.closest('.work-card'); if (!c) return;
        if (!c.classList.contains('is-center')) { e.preventDefault(); e.stopPropagation(); centerOn(cards.indexOf(c), true); }
      }, true);
      $$('[data-car-step]').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        const next = Math.max(0, Math.min(cards.length - 1, mark() + Number(btn.dataset.carStep)));
        centerOn(next, true);
      }));
      if (window.__oxCarResize) window.removeEventListener('resize', window.__oxCarResize);
      window.__oxCarResize = () => { measure(); centerOn(mark(), false); };
      window.addEventListener('resize', window.__oxCarResize);
      requestAnimationFrame(() => {
        measure();
        rail.style.scrollSnapType = 'none';
        rail.scrollLeft = centers[n * Math.floor(copies / 2)] - rail.clientWidth / 2;
        mark();
        requestAnimationFrame(() => { rail.style.scrollSnapType = ''; mark(); });
      });
    }

    function setupMotion() {
      stripSymbols(document.body);
      staggerReveal();
      setupCarousel();
      setupVideos();
      parallaxTick();
    }

    function render() {
      const main = $('#appMain');
      const pages = {home:homePage,work:workPage,services:servicesPage,packages:packagesPage,team:teamPage,booking:bookingPage,client:clientPage};
            let pageHtml = (pages[state.view] || homePage)();
      if (state.view === 'home' || state.view === 'booking') {
        const marker = '<section class="section"><div class="section-head"><div><div class="eyebrow">Contact the studio';
        pageHtml = pageHtml.replace(marker, () => extraSections(state.view) + marker);
      }
      const statusHtml = state.apiStatus === 'error'
        ? `<div class="data-status error"><span><b>Database belum tersambung.</b> ${esc(state.apiError)} Cek deployment Apps Script dan spreadsheet yang terhubung.</span><button type="button" id="refreshDatabase">Coba lagi</button></div>`
        : state.apiStatus === 'loading'
          ? `<div class="data-status"><span>Mengambil konten terbaru dari Google Sheets…</span><button type="button" disabled>Loading</button></div>`
                    : (state.apiStatus === 'live' && /[?&]admin=1/.test(location.search))
            ? `<div class="data-status live"><span>Live database · konten dimuat dari Google Sheets · API ${esc(state.apiVersion)}</span><button type="button" id="refreshDatabase">Refresh data</button></div>`
            : '';
      main.innerHTML = statusHtml + pageHtml;
      setupMotion();
      $$('.nav-item').forEach(button => {
        const active = button.dataset.view === state.view;
        button.classList.toggle('active',active);
        if (active) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current');
      });
      $('#brandName').textContent = setting('agency_name') || 'oxmo';
      $('#availabilityLabel').textContent = setting('availability_label') || 'Available for selected projects';
      $('#availabilityBadge').style.display = isTrue(setting('show_availability_badge')) ? 'flex' : 'none';
      $('#footerNote').textContent = ' · ' + (setting('footer_note') || 'Independent creative house · Bandung, Indonesia');
      $('#yearNow').textContent = new Date().getFullYear();
      document.title = (setting('app_name') || 'Oxmo One App') + ' — ' + (setting('agency_name') || 'Oxmo');
    }

    function openWork(workId) {
      const item = (state.data.portfolio || []).find(w => String(w.work_id || w.title) === String(workId));
      if (!item) return;
      state.lastFocus = document.activeElement;
      const trailer = validUrl(item.trailer_url);
      const poster = imgUrl(item.poster_url);
      $('#modalContent').innerHTML = `<div class="modal-poster">${workGallery(item)}</div><div class="modal-copy"><div style="display:flex;justify-content:flex-end"><button class="icon-button modal-close" type="button" data-close-modal aria-label="Close details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>${String(item.category || 'Film').toLowerCase() === 'film' || workImages(item).length > 1 ? `<div class="modal-poster-m">${workGallery(item)}</div>` : ''}<div class="eyebrow">${esc(item.category || 'Selected work')} · ${esc(item.credits || 'Oxmo')}</div><h2>${esc(item.title)}</h2><div class="modal-meta">${item.genre?`<span>${esc(item.genre)}</span>`:''}${item.duration?`<span>${esc(item.duration)}</span>`:''}${item.year?`<span>${esc(item.year)}</span>`:''}</div><p>${esc(item.synopsis && !String(item.synopsis).toLowerCase().includes('belum ditambahkan') && !String(item.synopsis).toLowerCase().includes('tambahkan sinopsis') ? item.synopsis : 'Official synopsis will be added soon. This project detail can be updated directly from the Portfolio tab in Google Sheets.')}</p>${trailer?`<a class="btn btn-primary" href="${esc(trailer)}" target="_blank" rel="noopener">Watch trailer ↗</a>`:''}</div>`;
      setupGallery(); $('#modalBackdrop').classList.add('open'); $('#modalBackdrop').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
      const close = $('[data-close-modal]'); if(close) close.focus();
    }

    function workImages(item) { const extra = String(item.gallery_urls || '').split(/[\s,|;]+/).map(u => imgUrl(u)); return unique([imgUrl(item.poster_url), ...extra]); } function workGallery(item) { const imgs = workImages(item); if (!imgs.length) return posterVisual(item, true); const nav = imgs.length > 1 ? `<button type="button" class="round-arrow gal-nav gal-prev" onclick="galStep(this,-1)" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button><button type="button" class="round-arrow gal-nav gal-next" onclick="galStep(this,1)" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg></button><div class="gal-count">1 / ${imgs.length}</div>` : ''; return `<div class="gal"><div class="gal-track">${imgs.map((u, i) => `<img src="${esc(u)}" alt="${esc(item.title)} ${i + 1}" loading="lazy">`).join('')}</div>${nav}</div>`; } function galStep(btn, dir) { const t = btn.parentElement.querySelector('.gal-track'); if (t) t.scrollBy({left: dir * t.clientWidth, behavior: 'smooth'}); } function setupGallery() { $$('#modalContent .gal').forEach(g => { const t = $('.gal-track', g), c = $('.gal-count', g); if (t && c) t.addEventListener('scroll', () => { c.textContent = (Math.round(t.scrollLeft / (t.clientWidth || 1)) + 1) + ' / ' + t.children.length; }, {passive:true}); }); } function closeModal() {
      $('#modalBackdrop').classList.remove('open'); $('#modalBackdrop').setAttribute('aria-hidden','true'); document.body.style.overflow='';
      if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus();
    }

    function updateBookingSubcategories(category, preserve=false) {
      state.bookingCategory = category;
      const subSelect = $('#serviceSubcategory');
      if (!subSelect) return;
      const subs = unique((state.data.services || []).filter(s=>s.category===category).map(s=>s.subcategory));
      const next = preserve && subs.includes(state.bookingSubcategory) ? state.bookingSubcategory : (subs[0] || 'Other');
      state.bookingSubcategory = next;
      subSelect.innerHTML = subs.map(s=>`<option value="${esc(s)}" ${s===next?'selected':''}>${esc(s)}</option>`).join('');
      updatePackageOptions();
    }

    function updatePackageOptions() {
      const select = $('#packageSelect'); if (!select) return;
      const packages = (state.data.packages || []).filter(p=>isTrue(p.active) && p.service_category===state.bookingCategory && p.subcategory===state.bookingSubcategory);
      select.innerHTML = '<option value="">Discuss a custom scope</option>' + packages.map(p=>`<option value="${esc(p.package_id)}">${esc(p.package_name)} — ${formatPrice(p.price,p.price_label)}</option>`).join('');
    }

    async function submitBooking(form) {
      if (!API_READY) { showToast('Hubungkan API_URL terlebih dahulu untuk menyimpan booking.',true); return; }
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());
      payload.consent = formData.get('consent') === 'true';
      const selectedPackage = (state.data.packages || []).find(p=>p.package_id===payload.package_id);
      payload.package_name = selectedPackage ? selectedPackage.package_name : '';
      const button = $('button[type="submit"]',form); button.disabled = true; button.textContent = 'Sending request…';
      try {
        const response = await apiPost('submitBooking',payload);
        showToast((setting('booking_success_message') || 'Your request has been received.') + (response.booking_id ? ' Ref: '+response.booking_id : ''));
        form.reset();
      } catch (error) {
        showToast(error.message,true);
      } finally {
        button.disabled = false; button.textContent = 'Send booking request ↗';
      }
    }

    async function sha256Hex(text) {
      const digest = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
      return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    async function hmacHex(keyText, message) {
      const key = await crypto.subtle.importKey('raw',new TextEncoder().encode(keyText),{name:'HMAC',hash:'SHA-256'},false,['sign']);
      const signature = await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(message));
      return Array.from(new Uint8Array(signature)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    async function clientLogin(form) {
      if (!API_READY) { showToast('Hubungkan API_URL terlebih dahulu.',true); return; }
      const email = plain($('#clientEmail',form).value).toLowerCase();
      const code = plain($('#clientCode',form).value);
      const button = $('button[type="submit"]',form); button.disabled = true; button.textContent = 'Verifying…';
      try {
        if (!window.crypto || !crypto.subtle) throw new Error('Secure sign-in requires HTTPS. Gunakan GitHub Pages.');
        const challenge = await apiPost('clientChallenge',{email});
        const verifier = await sha256Hex(challenge.salt + ':' + code);
        const proof = await hmacHex(verifier,challenge.nonce);
        const login = await apiPost('clientLogin',{email,nonce:challenge.nonce,proof});
        state.clientToken = login.token;
        sessionStorage.setItem('oxmo_client_token',login.token);
        const projects = await apiPost('clientData',{token:login.token});
        state.clientData = projects;
        render(); showToast('Client workspace unlocked.');
      } catch (error) {
        showToast(error.message,true);
        button.disabled = false; button.textContent = 'Sign in securely ↗';
      }
    }

    async function restoreClientSession() {
      const token = sessionStorage.getItem('oxmo_client_token');
      if (!token || !API_READY) return;
      try {
        const data = await apiPost('clientData',{token});
        state.clientToken = token; state.clientData = data;
      } catch (_) {
        sessionStorage.removeItem('oxmo_client_token'); state.clientToken = ''; state.clientData = null;
      }
    }

    document.addEventListener('click', event => {
      const refreshButton = event.target.closest('#refreshDatabase');
      if (refreshButton) {
        refreshButton.disabled = true; refreshButton.textContent = 'Refreshing…';
        state.apiStatus = 'loading'; render();
        loadPublicData().then(ok => { render(); showToast(ok ? 'Database berhasil diperbarui.' : 'Database belum berhasil dimuat. Periksa pesan di atas.', !ok); });
        return;
      }
      const viewButton = event.target.closest('[data-view]');
      if (viewButton) {
        event.preventDefault(); state.view = viewButton.dataset.view; window.location.hash = state.view; render(); window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      const filter = event.target.closest('[data-filter]');
      if (filter) { state.workFilter = filter.dataset.filter; render(); return; }
      const work = event.target.closest('[data-work-id]');
      if (work) { openWork(work.dataset.workId); return; }
      const scroller = event.target.closest('[data-scroll]');
      if (scroller) { const el = $('#'+scroller.dataset.scroll); if(el) el.scrollBy({left:Number(scroller.dataset.dir)*Math.max(250,el.clientWidth*.75),behavior:'smooth'}); return; }
      const bookCategory = event.target.closest('[data-book-category]');
      if (bookCategory) { state.bookingCategory=bookCategory.dataset.bookCategory; state.bookingSubcategory=''; state.view='booking'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      const bookPackage = event.target.closest('[data-book-package]');
      if (bookPackage) {
        const p = (state.data.packages || []).find(x=>x.package_id===bookPackage.dataset.bookPackage);
        if (p) { state.bookingCategory=p.service_category; state.bookingSubcategory=p.subcategory; }
        state.view='booking'; render(); const select=$('#packageSelect'); if(select) select.value=bookPackage.dataset.bookPackage; window.scrollTo({top:0,behavior:'smooth'}); return;
      }
      if (event.target.closest('[data-close-modal]')) { closeModal(); return; }
    });

    document.addEventListener('change', event => {
      if (event.target.id === 'serviceCategory') updateBookingSubcategories(event.target.value);
      if (event.target.id === 'serviceSubcategory') { state.bookingSubcategory = event.target.value; updatePackageOptions(); }
    });

    document.addEventListener('submit', event => {
      if (event.target.id === 'bookingForm') { event.preventDefault(); if(event.target.reportValidity()) submitBooking(event.target); }
      if (event.target.id === 'clientLoginForm') { event.preventDefault(); if(event.target.reportValidity()) clientLogin(event.target); }
    });

    document.addEventListener('click', event => {
      if (event.target.id === 'clientLogout') {
        sessionStorage.removeItem('oxmo_client_token'); state.clientToken=''; state.clientData=null; render(); showToast('You have signed out.');
      }
    });

    $('#modalBackdrop').addEventListener('click', event => { if(event.target.id==='modalBackdrop') closeModal(); });
    document.addEventListener('keydown', event => { if(event.key==='Escape' && $('#modalBackdrop').classList.contains('open')) closeModal(); });
    window.addEventListener('hashchange', () => {
      const view = location.hash.replace('#','');
      if (['home','work','services','packages','team','booking','client'].includes(view) && state.view!==view) { state.view=view; render(); }
    });

    (async function init() {
      const firstView = location.hash.replace('#','');
      if (['home','work','services','packages','team','booking','client'].includes(firstView)) state.view=firstView;
      await loadPublicData();
      await restoreClientSession();
      render();
      setTimeout(()=>$('#loadingScreen').classList.add('done'),650);
    })();
  </script>
</body>
</html>
